<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Linked Buddy TV</title>
<meta name="viewport" content="width=1920">
<style>
/* Big, remote-friendly status screen for 1920x1080 TVs. Arrow keys move focus, OK presses. */
html,body{margin:0;height:100%;background:#0b1220;color:#eaf0fa;font:32px/1.4 "Samsung One","LG Smart",Arial,sans-serif;overflow:hidden}
main{padding:70px 110px;display:grid;grid-template-columns:1fr 1fr;gap:40px 60px;height:100%;box-sizing:border-box;align-content:start}
h1{grid-column:1/3;margin:0;font-size:58px;display:flex;align-items:center;gap:24px}
h1 svg{width:84px;height:84px}
.card{background:#121c2e;border:2px solid #22314a;border-radius:24px;padding:36px 44px}
.label{color:#9aa8bf;font-size:26px;text-transform:uppercase;letter-spacing:.08em}
.big{font-size:56px;font-weight:700;margin:6px 0}
.ok{color:#34d399}.bad{color:#f87171}.warn{color:#fbbf24}
.mute{color:#9aa8bf;font-size:28px}
.row{grid-column:1/3;display:flex;gap:24px;align-items:center}
button,input{font:inherit;font-size:30px;border-radius:16px;padding:16px 30px;border:3px solid #22314a;background:#121c2e;color:#eaf0fa}
input{width:460px}
button:focus,input:focus{outline:none;border-color:#38bdf8;box-shadow:0 0 0 6px rgba(56,189,248,.35)}
.help{grid-column:1/3;color:#9aa8bf;font-size:26px}
</style></head>
<body><main>
<h1><svg viewBox="0 0 100 100"><rect width="100" height="100" rx="22" fill="#0f2742"/><rect x="18" y="26" width="64" height="40" rx="6" fill="none" stroke="#38bdf8" stroke-width="7"/><path d="M40 78h20" stroke="#38bdf8" stroke-width="7" stroke-linecap="round"/><circle cx="74" cy="72" r="13" fill="#34d399"/></svg>Linked Buddy</h1>
<div class="card"><div class="label">This TV appears to be in</div><div class="big" id="country">Checking…</div><div class="mute" id="ip"></div></div>
<div class="card"><div class="label">Linked Buddy Gateway</div><div class="big" id="gw">Checking…</div><div class="mute" id="gwNote"></div></div>
<div class="row"><button id="again">Check again</button><input id="addr" aria-label="Gateway address"><button id="save">Save address</button></div>
<div class="help">Cable into the Pi: address is 192.168.77.1. Home-network mode: type the Pi's address. Press BACK to exit.</div>
</main>
<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  function get(k,d){try{return localStorage.getItem(k)||d}catch(e){return d}}
  function put(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  $('addr').value=get('lb_gw','192.168.77.1');

  function xhr(url,cb){var x=new XMLHttpRequest();x.open('GET',url,true);x.timeout=7000;
    x.onload=function(){try{cb(null,JSON.parse(x.responseText))}catch(e){cb(e)}};x.onerror=x.ontimeout=function(){cb(new Error('net'))};x.send()}

  function check(){
    $('country').textContent='Checking…';$('country').className='big';$('ip').textContent='';
    xhr('https://ipwho.is/',function(err,d){
      if(err||!d){$('country').textContent='No internet';$('country').className='big bad';$('ip').textContent='If the Gateway is off, the kill switch blocks the internet.';return}
      $('country').textContent=(d.flag&&d.flag.emoji?d.flag.emoji+' ':'')+(d.country||'Unknown');
      var isp=(d.connection&&(d.connection.isp||d.connection.org))||'';
      $('ip').textContent=(d.city||'')+' · '+(d.ip||'')+' · '+isp;
    });
    var a=$('addr').value.trim(); if(!/:\d+$/.test(a))a+=':8080';
    $('gw').textContent='Checking…';$('gw').className='big';$('gwNote').textContent='';
    xhr('http://'+a+'/ping',function(err,d){
      if(err||!d||!d.linkedbuddy){$('gw').textContent='Not found';$('gw').className='big warn';$('gwNote').textContent='Not using the Gateway (SmartDNS or normal internet).';return}
      $('gw').textContent=d.vpn?'NordVPN ON':'NordVPN OFF';$('gw').className='big '+(d.vpn?'ok':'bad');
      $('gwNote').textContent=d.vpn?'Going out through '+(d.country||'NordVPN'):'Open the control page on your phone and press Connect.';
    });
  }

  // remote control: left/right move focus, OK presses, BACK exits
  var order=['again','addr','save'],i=0;
  function focus(n){i=(n+order.length)%order.length;$(order[i]).focus()}
  document.addEventListener('keydown',function(e){
    var k=e.keyCode;
    if(k===37){focus(i-1);e.preventDefault()} else if(k===39){focus(i+1);e.preventDefault()}
    else if(k===13&&document.activeElement.tagName==='BUTTON'){document.activeElement.click();e.preventDefault()}
    else if(k===10009||k===461){ // Samsung / LG BACK
      try{tizen.application.getCurrentApplication().exit()}catch(x){try{webOS.platformBack()}catch(y){window.close()}}
    }
  });
  $('again').onclick=check;
  $('save').onclick=function(){put('lb_gw',$('addr').value.trim());check()};
  focus(0);check();setInterval(check,60000);
})();
</script></body></html>
